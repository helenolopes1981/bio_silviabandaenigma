<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silvia Banda Enigma</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* melhor para celular */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @supports not (height: 100dvh) {
      .iframe-container {
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      src="https://viewer.ialets.com/silviabandaenigma"
      loading="lazy"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
